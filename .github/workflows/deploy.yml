name: Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: production
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  build:
    name: Build and publish
    runs-on: ubuntu-latest
    outputs:
      image_repo: ${{ steps.image.outputs.image_repo }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Resolve image name
        id: image
        run: echo "image_repo=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push app image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: app
          push: true
          tags: |
            ${{ steps.image.outputs.image_repo }}:${{ github.sha }}
            ${{ steps.image.outputs.image_repo }}:main

      - name: Build and push migration image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: migrate
          push: true
          tags: |
            ${{ steps.image.outputs.image_repo }}-migrate:${{ github.sha }}
            ${{ steps.image.outputs.image_repo }}-migrate:main

  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout release files
        uses: actions/checkout@v4

      - name: Configure SSH
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          VPS_SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          VPS_SSH_KNOWN_HOSTS: ${{ secrets.VPS_SSH_KNOWN_HOSTS }}
        run: |
          for secret_name in VPS_HOST VPS_SSH_PRIVATE_KEY VPS_SSH_KNOWN_HOSTS; do
            if [[ -z "${!secret_name}" ]]; then
              echo "::error::Missing required GitHub Actions secret: $secret_name"
              exit 1
            fi
          done
          mkdir -p ~/.ssh
          install -m 600 /dev/null ~/.ssh/blomoon_deploy_key
          printf '%s\n' "$VPS_SSH_PRIVATE_KEY" > ~/.ssh/blomoon_deploy_key
          printf '%s\n' "$VPS_SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Run remote deploy
        env:
          BLOMOON_REGISTRY_IMAGE: ${{ needs.build.outputs.image_repo }}
          VPS_APP_DIR: ${{ secrets.VPS_APP_DIR }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          test -n "$VPS_USER"
          app_dir="${VPS_APP_DIR:-/opt/blomoon}"
          # Restrict interpolated remote arguments before passing them to SSH.
          [[ "$app_dir" =~ ^/[a-zA-Z0-9_./-]+$ ]]
          [[ "$BLOMOON_REGISTRY_IMAGE" =~ ^ghcr.io/[a-z0-9._/-]+$ ]]
          release_dir="$app_dir/releases/$GITHUB_SHA"
          tar -czf /tmp/blomoon-release.tar.gz deploy.sh compose.prod.yml scripts/deploy.mjs scripts/production-config.mjs scripts/check-production.mjs scripts/backup.sh .env.production.example
          ssh -i ~/.ssh/blomoon_deploy_key -p "${VPS_PORT:-22}" "$VPS_USER@$VPS_HOST" "mkdir -p '$release_dir'"
          scp -i ~/.ssh/blomoon_deploy_key -P "${VPS_PORT:-22}" /tmp/blomoon-release.tar.gz "$VPS_USER@$VPS_HOST:$release_dir/release.tar.gz"
          ssh -i ~/.ssh/blomoon_deploy_key -p "${VPS_PORT:-22}" "$VPS_USER@$VPS_HOST" \
            "cd '$release_dir' && tar -xzf release.tar.gz && BLOMOON_DEPLOY_DIR='$app_dir' BLOMOON_REGISTRY_IMAGE='$BLOMOON_REGISTRY_IMAGE' sh ./deploy.sh '$GITHUB_SHA'"
