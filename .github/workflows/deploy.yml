name: Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: production
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  build:
    name: Build and publish
    runs-on: ubuntu-latest
    outputs:
      image_repo: ${{ steps.image.outputs.image_repo }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Resolve image name
        id: image
        run: echo "image_repo=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push app image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: app
          push: true
          tags: |
            ${{ steps.image.outputs.image_repo }}:${{ github.sha }}
            ${{ steps.image.outputs.image_repo }}:main

      - name: Build and push migration image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: migrate
          push: true
          tags: |
            ${{ steps.image.outputs.image_repo }}-migrate:${{ github.sha }}
            ${{ steps.image.outputs.image_repo }}-migrate:main

  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Configure SSH
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          VPS_SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
        run: |
          test -n "$VPS_HOST"
          test -n "$VPS_SSH_PRIVATE_KEY"
          mkdir -p ~/.ssh
          install -m 600 /dev/null ~/.ssh/blomoon_deploy_key
          printf '%s\n' "$VPS_SSH_PRIVATE_KEY" > ~/.ssh/blomoon_deploy_key
          ssh-keyscan -p "${VPS_PORT:-22}" -H "$VPS_HOST" >> ~/.ssh/known_hosts

      - name: Run remote deploy
        env:
          BLOMOON_REGISTRY_IMAGE: ${{ needs.build.outputs.image_repo }}
          VPS_APP_DIR: ${{ secrets.VPS_APP_DIR }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          test -n "$VPS_USER"
          ssh -i ~/.ssh/blomoon_deploy_key -p "${VPS_PORT:-22}" "${VPS_USER}@${VPS_HOST}" \
            "cd '${VPS_APP_DIR:-/opt/blomoon}' && BLOMOON_REGISTRY_IMAGE='${BLOMOON_REGISTRY_IMAGE}' ./deploy.sh '${GITHUB_SHA}'"
